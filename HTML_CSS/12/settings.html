<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Diary - Settings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-diary">
        <div class="container">
            <a class="navbar-brand me-4" href="index.html">
                <i class="bi bi-person-workspace navbar-logo" aria-hidden="true"></i>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarDiary"
                aria-controls="navbarDiary" aria-expanded="false" aria-label="Menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarDiary">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="homework.html">Homework</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="settings.html">Settings</a>
                    </li>
                </ul>
                <a class="avatar-link ms-auto" href="settings.html">
                    <img src="assets/img/av_64.png" alt="Profile" class="rounded-circle">
                </a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <h1 class="page-title page-title-main">Settings</h1>

        <div class="row settings-bar text-center">
            <div class="col-lg-3">AVATAR</div>
            <div class="col-lg-5">STUDENT'S INFO</div>
            <div class="col-lg-4">CHANGE PASSWORD</div>
        </div>

        <div class="row">
            <section class="col-lg-3 text-center mb-4">
                <div class="settings-avatar mb-3">
                    <img src="assets/img/av_256.png" alt="Avatar" class="rounded-circle">
                </div>
                <button type="button" class="btn btn-diary">Choose photo</button>
            </section>

            <section class="col-lg-5 mb-4">
                <form>
                    <input type="text" class="form-control mb-3" placeholder="First name">
                    <input type="text" class="form-control mb-3" placeholder="Last name">
                    <input type="email" class="form-control mb-3" placeholder="Email">
                    <input type="tel" class="form-control mb-3" placeholder="Phone number">
                    <input type="text" class="form-control mb-3" placeholder="Address">
                    <input type="text" class="form-control mb-3" placeholder="FB link">
                    <button type="submit" class="btn btn-diary">Save changes</button>
                </form>
            </section>

            <section class="col-lg-4 mb-4">
                <form>
                    <input type="password" class="form-control mb-3" placeholder="Old password">
                    <input type="password" class="form-control mb-3" placeholder="New password">
                    <input type="password" class="form-control mb-3" placeholder="Repeat password">
                    <button type="submit" class="btn btn-diary">Change password</button>
                </form>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
