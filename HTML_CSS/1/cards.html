<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="content-body cards-body">
    <div class="player">
        <div class="player-label">Player 1:</div>
        <div class="cards">
            <div class="card"><span class="rank black">2</span><span class="suit black">&clubs;</span></div>
            <div class="card"><span class="rank red">9</span><span class="suit red">&hearts;</span></div>
            <div class="card"><span class="rank red">6</span><span class="suit red">&hearts;</span></div>
            <div class="card"><span class="rank red">A</span><span class="suit red">&diams;</span></div>
            <div class="card"><span class="rank black">Q</span><span class="suit black">&spades;</span></div>
            <div class="card"><span class="rank black">J</span><span class="suit black">&clubs;</span></div>
        </div>
    </div>

    <div class="player">
        <div class="player-label">Player 2:</div>
        <div class="cards">
            <div class="card"><span class="rank red">3</span><span class="suit red">&hearts;</span></div>
            <div class="card"><span class="rank black">A</span><span class="suit black">&clubs;</span></div>
            <div class="card"><span class="rank black">10</span><span class="suit black">&clubs;</span></div>
            <div class="card"><span class="rank red">K</span><span class="suit red">&diams;</span></div>
            <div class="card"><span class="rank black">8</span><span class="suit black">&spades;</span></div>
            <div class="card"><span class="rank red">3</span><span class="suit red">&hearts;</span></div>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; Back to main page</a>
</body>
</html>
