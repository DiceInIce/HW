<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="registration.css">
</head>

<body>
    <form class="reg-form" action="#" method="post">
        <div class="reg-form__main">
            <section class="reg-form__section reg-form__section--account">
                <h2>Registration form</h2>

                <div class="reg-form__field">
                    <span class="reg-form__icon"><img src="img/username.png" alt=""></span>
                    <input type="text" name="username" placeholder="Username" required>
                </div>

                <div class="reg-form__field">
                    <span class="reg-form__icon"><img src="img/email.png" alt=""></span>
                    <input type="email" name="email" placeholder="Email address" required>
                </div>

                <div class="reg-form__row reg-form__row--password">
                    <div class="reg-form__field">
                        <span class="reg-form__icon"><img src="img/pswd.png" alt=""></span>
                        <input type="password" name="password" placeholder="Password" required>
                    </div>
                    <div class="reg-form__field reg-form__field--confirm">
                        <input type="password" name="password-confirm" placeholder="Confirm password" required>
                    </div>
                </div>

                <div class="reg-form__options">
                    <label class="reg-form__checkbox">
                        <input type="checkbox" name="newsletter">
                        I want to receive news and special offers
                    </label>
                    <label class="reg-form__checkbox">
                        <input type="checkbox" name="terms" required>
                        I agree with the Terms and Conditions
                    </label>
                </div>
            </section>

            <section class="reg-form__section reg-form__section--personal">
                <h2>Personal details</h2>

                <div class="reg-form__row reg-form__row--name">
                    <div class="reg-form__field">
                        <input type="text" name="first-name" placeholder="First name" required>
                    </div>
                    <div class="reg-form__field">
                        <input type="text" name="last-name" placeholder="Last name" required>
                    </div>
                </div>

                <div class="reg-form__row reg-form__row--details">
                    <div class="reg-form__field">
                        <select name="gender" aria-label="Gender">
                            <option value="male" selected>Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="reg-form__field">
                        <input type="text" name="birthdate" placeholder="mm/dd/yyyy">
                    </div>
                </div>
            </section>
        </div>

        <footer class="reg-form__footer">
            <button type="submit" class="reg-form__submit">SUBMIT</button>
        </footer>
    </form>
</body>

</html>
